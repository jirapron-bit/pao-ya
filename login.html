<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - เฝ้ายา</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="mobile-frame">
    <!-- Notch ด้านบน -->
    <div class="notch"></div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <span>📶</span>
        <span>📡</span>
        <span>🔋</span>
      </div>
    </div>

    <!-- ปุ่มย้อนกลับด้านบนซ้าย -->
    <div class="header-nav">
      <a href="index.html" class="back-btn">&lt;</a>
    </div>

    <!-- เนื้อหาฟอร์มเข้าสู่ระบบ -->
    <div class="login-container">
      
      <!-- ไอคอนรูปแคปซูลยา และ หัวข้อ -->
      <div class="header-section">
        <div class="pill-icon">💊</div>
        <h1 class="page-title">เข้าสู่ระบบ</h1>
      </div>

      <!-- ฟอร์มกรอกข้อมูล -->
      <form class="login-form" onsubmit="return false;">
        
        <!-- ช่องกรอก อีเมล หรือ ชื่อผู้ใช้ -->
        <div class="form-group">
          <label for="username">อีเมล หรือ ชื่อผู้ใช้</label>
          <input type="text" id="username" placeholder="ใส่อีเมล หรือ ชื่อผู้ใช้">
        </div>

        <!-- ช่องกรอก รหัสผ่าน -->
        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" placeholder="ใส่รหัสผ่าน">
            <span class="toggle-password">👁️</span>
          </div>
        </div>

        <!-- ลิงก์ลืมรหัสผ่าน & สร้างบัญชี -->
        <div class="form-links">
          <a href="#" class="link-item">ลืมรหัสผ่าน</a>
          <a href="#" class="link-item">สร้างบัญชี</a>
        </div>

        <!-- ปุ่มยืนยัน -->
        <button type="submit" class="btn-submit">ยืนยัน</button>
        
      </form>

    </div>
  </div>

</body>
</html>
